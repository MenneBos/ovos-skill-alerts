[pytest]
# Bound every test to a hard wall-clock limit. Without this, an ovoscope e2e
# test that hangs (e.g. a skill blocking on get_response with no synthetic
# answer message) runs until the CI job's 60-minute timeout instead of
# failing fast with a diagnosable thread dump.
timeout = 420
# m2v routed 83% to 86% of the end2end requests as expected on the
# published model; the share moves by a few points from one boot to the next.
ovoscope_min_routing_rate = 0.75
